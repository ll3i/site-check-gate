<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장 보고 검증 게이트</title>
<style>
:root {
  --green: #15803d;
  --green-bg: #dcfce7;
  --green-fg: #166534;
  --orange: #c2410c;
  --orange-bg: #ffedd5;
  --orange-fg: #9a3412;
  --yellow: #a16207;
  --yellow-bg: #fef9c3;
  --yellow-fg: #854d0e;
  --red: #b91c1c;
  --red-bg: #fee2e2;
  --red-fg: #991b1b;
  --gray: #6b7280;
  --gray-bg: #f3f4f6;
  --gray-fg: #374151;
  --blue: #1a56db;
  --blue-bg: #dbeafe;
  --blue-fg: #1e40af;
  --white: #fff;
  --bg: #f7f7f8;
  --card: #fff;
  --border: #d0d0d0;
  --text: #1a1a1a;
  --text-secondary: #555;
}

* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 48px;
  color: var(--text);
  background: var(--bg);
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

/* ===== 히어로 ===== */
.hero {
  text-align: center;
  padding: 28px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.hero h1 {
  font-size: 22px;
  margin: 0 0 6px;
  letter-spacing: -0.3px;
  color: var(--text);
}
.hero-sub {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0 0 14px;
  line-height: 1.5;
}
.icon-row {
  display: flex;
  justify-content: center;
  gap: 18px;
  font-size: 22px;
  user-select: none;
}
.icon-row span {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: default;
}
.icon-row small {
  font-size: 10px;
  color: var(--gray);
  letter-spacing: 0;
}

/* ===== 버튼 영역 ===== */
.big-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}
.big-btn {
  display: block;
  width: 100%;
  height: 56px;
  padding: 0 16px;
  border: 2px solid var(--blue);
  border-radius: 10px;
  background: var(--blue-bg);
  color: var(--blue-fg);
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  line-height: 56px;
  user-select: none;
}
.big-btn:hover { background: #eff6ff; }
.big-btn input,
#docInput,
#photoInput,
#noticeInput {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.big-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.file-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  min-height: 0;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 6px 4px 12px;
  font-size: 13px;
  color: var(--text);
}
.chip .name {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip .size {
  color: var(--gray);
  font-size: 11px;
}
.chip button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: var(--gray);
  padding: 0 2px;
  line-height: 1;
}
.chip button:hover { color: var(--red); }

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.demo-btn {
  flex: 1;
  min-width: 180px;
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--white);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.demo-btn:hover { background: var(--gray-bg); }
.start-btn {
  flex: 2;
  min-width: 200px;
  height: 56px;
  border: none;
  border-radius: 10px;
  background: #999;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: not-allowed;
  transition: background 0.15s;
}
.start-btn.active {
  background: var(--blue);
  cursor: pointer;
}
.start-btn.active:hover { background: #1647c0; }

.advanced {
  margin-top: 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--white);
}
.advanced summary {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--gray);
  list-style: none;
}
.advanced summary::-webkit-details-marker { display: none; }
.advanced summary::before { content: '▶ '; display: inline-block; margin-right: 4px; transition: transform 0.15s; }
.advanced[open] summary::before { transform: rotate(90deg); }
.advanced .inner {
  padding: 8px 14px 14px;
}
.advanced .big-btn {
  height: 44px;
  font-size: 14px;
  line-height: 44px;
}

/* ===== 진행 화면 ===== */
.progress-screen {
  text-align: center;
  padding: 32px 0 24px;
}
.stepper {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-bottom: 18px;
}
.step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  background: var(--gray-bg);
  color: var(--gray);
  border: 1px solid transparent;
}
.step .num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--gray);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.step.active {
  background: var(--blue-bg);
  color: var(--blue-fg);
  border-color: var(--blue);
}
.step.active .num {
  background: var(--blue);
}
.step.done {
  background: var(--green-bg);
  color: var(--green-fg);
}
.step.done .num {
  background: var(--green);
}
.progress-bar {
  height: 8px;
  background: var(--gray-bg);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 10px;
}
.progress-fill {
  height: 100%;
  background: var(--blue);
  width: 0%;
  transition: width 0.4s;
}
.progress-label {
  font-size: 13px;
  color: var(--gray);
  margin-bottom: 4px;
}
.progress-note {
  font-size: 12px;
  color: var(--gray);
}
.retry-badge {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 12px;
  background: var(--gray-bg);
  color: var(--gray);
  border-radius: 12px;
  font-size: 12px;
}

/* ===== 결과 화면 ===== */
.result-screen { margin-top: 8px; }

.gate-banner {
  padding: 14px 16px;
  border-radius: 10px;
  margin-bottom: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}
.gate-banner.submittable {
  background: var(--green-bg);
  color: var(--green-fg);
  border: 1px solid #86efac;
}
.gate-banner.revision {
  background: var(--orange-bg);
  color: var(--orange-fg);
  border: 1px solid #fdba74;
}
.gate-banner.check {
  background: var(--yellow-bg);
  color: var(--yellow-fg);
  border: 1px solid #fde68a;
}
.gate-banner .icon { font-size: 22px; }
.gate-banner .reason {
  font-weight: 400;
  font-size: 13px;
  opacity: 0.85;
}

.section-heading {
  font-size: 15px;
  font-weight: 700;
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--border);
}
.section-heading .count {
  display: inline-block;
  background: var(--red);
  color: #fff;
  border-radius: 12px;
  padding: 0 8px;
  font-size: 12px;
  margin-left: 6px;
  vertical-align: middle;
}

.action-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  border-left: 4px solid var(--gray);
}
.card.badge-danger { border-left-color: var(--red); }
.card.badge-warning { border-left-color: var(--orange); }
.card.badge-caution { border-left-color: var(--yellow); }

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.card-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.card-badge.danger { background: var(--red-bg); color: var(--red-fg); }
.card-badge.warning { background: var(--orange-bg); color: var(--orange-fg); }
.card-badge.caution { background: var(--yellow-bg); color: var(--yellow-fg); }

.card-title {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}

.card-problem {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0 0 8px;
}

.card-evidence {
  font-size: 12px;
  color: var(--text-secondary);
  margin: 0 0 8px;
  padding: 8px;
  background: var(--gray-bg);
  border-radius: 6px;
  overflow-wrap: break-word;
  line-height: 1.45;
}

.card-actions {
  font-size: 12px;
  color: var(--blue);
  font-weight: 500;
}
.card-actions::before { content: '➜ '; }

.photo-thumb {
  display: inline-block;
  width: 120px;
  height: 80px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
  margin-right: 10px;
  vertical-align: middle;
}
.detection-label {
  display: inline-block;
  background: var(--blue-bg);
  color: var(--blue-fg);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 4px;
  vertical-align: middle;
}

.accordion {
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 14px;
  overflow: hidden;
}
.accordion summary {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  background: var(--white);
  list-style: none;
  color: var(--text);
}
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary::before { content: '▶ '; display: inline-block; margin-right: 4px; transition: transform 0.15s; }
.accordion[open] summary::before { transform: rotate(90deg); }
.accordion .inner {
  padding: 0 14px 14px;
  font-size: 13px;
  color: var(--text-secondary);
}
.accordion .inner .item {
  padding: 6px 0;
  border-bottom: 1px solid var(--gray-bg);
}
.accordion .inner .item:last-child { border-bottom: none; }
.accordion .inner .item-label { font-weight: 500; color: var(--text); }

.ok-summary {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 8px 0;
}
.expand-btn {
  background: none;
  border: none;
  color: var(--blue);
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  padding: 0;
  margin-top: 4px;
}

.subcontract-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.subbadge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}
.subbadge.risk { background: var(--red-bg); color: var(--red-fg); }
.subbadge.compliant { background: var(--green-bg); color: var(--green-fg); }
.subbadge.noneed { background: var(--yellow-bg); color: var(--yellow-fg); }

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.result-actions button {
  flex: 1;
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--white);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.result-actions button:hover { background: var(--gray-bg); }

/* ===== 인라인 오류 배너 ===== */
.error-banner {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: var(--red);
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 9999;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.error-banner .msg { flex: 1; line-height: 1.4; }
.error-banner .close-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: #fff;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
}
.error-banner .close-btn:hover { background: rgba(255,255,255,0.35); }

.empty-state {
  color: var(--gray);
  font-size: 13px;
  padding: 12px 0;
}

@media (min-width: 768px) {
  body { max-width: 900px; padding: 32px 24px 48px; }
  .action-cards { flex-direction: row; flex-wrap: wrap; }
  .card { flex: 1 1 280px; }
  .hero h1 { font-size: 26px; }
}
</style>
</head>
<body>

<!-- ===== 히어로 ===== -->
<header class="hero">
  <h1>현장 사진으로 안전 점검</h1>
  <p class="hero-sub">현장 사진을 찍으면, 위험 요소를 찾아 관련 법령과 조치까지 알려드립니다</p>
  <div class="icon-row" aria-label="점검 항목">
    <span>📷<small>현장 사진</small></span>
    <span>⚖️<small>관련 법령</small></span>
    <span>🛠️<small>조치 권고</small></span>
  </div>
</header>

<!-- ===== 업로드(주 CTA = 사진 점검) 화면 ===== -->
<main id="uploadArea">
  <div class="big-buttons">
    <!-- 주 CTA: 사진 기반 안전 점검 -->
    <label class="big-btn" for="photoInput">📷 현장 사진으로 안전 점검</label>
    <input type="file" id="photoInput" accept="image/*" multiple>

    <!-- 부 CTA: 보고서 검증 (기존 흐름은 아래로) -->
    <label class="big-btn" for="docInput">📄 보고서 검증하기</label>
    <input type="file" id="docInput" accept=".pdf,.docx,.txt,.hwp">
  </div>

  <div class="file-chips" id="fileChips"></div>

  <details class="advanced">
    <summary>고급</summary>
    <div class="inner">
      <label class="big-btn" for="noticeInput">📋 점검 지시·공고 추가</label>
      <input type="file" id="noticeInput" accept=".pdf,.docx,.txt">
    </div>
  </details>

  <div class="action-row">
    <button class="demo-btn" id="inspectDemoBtn">📷 점검 샘플 체험 (사진 3장)</button>
    <button class="demo-btn" id="verifyDemoBtn">📄 검증 샘플 체험 (보고서+사진)</button>
    <button class="start-btn" id="startBtn" disabled>사진 선택 후 안전 점검 시작</button>
  </div>
</main>

<!-- ===== 진행 화면 ===== -->
<section class="progress-screen" id="progressScreen" style="display:none">
  <div class="stepper">
    <div class="step active" id="step1"><span class="num">1</span>문서 판독</div>
    <div class="step" id="step2"><span class="num">2</span>법령·문헌 대조</div>
    <div class="step" id="step3"><span class="num">3</span>사진 분석</div>
    <div class="step" id="step4"><span class="num">4</span>종합 판정</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0%</div>
  <div class="progress-note">보통 1~2분</div>
  <div class="retry-badge" id="retryBadge" style="display:none">연결 재시도 중…</div>
</section>

<!-- ===== 결과 화면 ===== -->
<section class="result-screen" id="resultScreen" style="display:none"></section>
<div id="errorBanner" style="display:none"></div>

<script>
(function () {
  'use strict';

  // ── 상태 ──────────────────────────────────────────────────────────────────
  const state = {
    photos: [],      // 사진 점검 모드용
    doc: null,       // 보고서 검증 모드용
    notice: null,
  };
  const mode = { kind: 'inspect' }; // 'inspect' | 'verify'
  let jobId = null;
  let pollTimer = null;
  let retryCount = 0;
  let pollRestartTimer = null;

  // ── 파일 칩 렌더링 ────────────────────────────────────────────────────────
  const fileChips = document.getElementById('fileChips');

  function formatSize(bytes) {
    if (bytes > 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    if (bytes > 1024) return (bytes / 1024).toFixed(0) + 'KB';
    return bytes + 'B';
  }

  function renderChips() {
    fileChips.innerHTML = '';
    const items = [];
    if (state.doc) items.push({ type: '문서', file: state.doc });
    state.photos.forEach(f => items.push({ type: '사진', file: f }));
    if (state.notice) items.push({ type: '공고문', file: state.notice });

    items.forEach(({ type, file }) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML =
        '<span class="name">' + escapeHtml(file.name) + '</span>' +
        '<span class="size">' + formatSize(file.size) + '</span>' +
        '<button data-type="' + type + '" data-name="' + escapeAttr(file.name) + '">×</button>';
      fileChips.appendChild(chip);
    });

    fileChips.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function () {
        const type = this.dataset.type;
        const name = this.dataset.name;
        if (type === '문서') state.doc = null;
        else if (type === '사진') {
          state.photos = state.photos.filter(f => f.name !== name);
        } else if (type === '공고문') state.notice = null;
        renderChips();
        updateStartButton();
      });
    });
  }

  function escapeHtml(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function escapeAttr(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  // ── 입력 이벤트 ───────────────────────────────────────────────────────────
  const docInput = document.getElementById('docInput');
  const photoInput = document.getElementById('photoInput');
  const noticeInput = document.getElementById('noticeInput');

  photoInput.addEventListener('change', () => {
    if (photoInput.files.length) {
      state.photos = Array.from(photoInput.files);
      mode.kind = 'inspect';
    }
    renderChips();
    updateStartButton();
  });

  docInput.addEventListener('change', () => {
    if (docInput.files.length) {
      state.doc = docInput.files[0];
      mode.kind = 'verify';
    }
    renderChips();
    updateStartButton();
  });

  noticeInput.addEventListener('change', () => {
    if (noticeInput.files.length) {
      state.notice = noticeInput.files[0];
    }
    renderChips();
    updateStartButton();
  });

  function updateStartButton() {
    const btn = document.getElementById('startBtn');
    if (mode.kind === 'inspect' && state.photos.length > 0) {
      btn.disabled = false;
      btn.classList.add('active');
      btn.textContent = '안전 점검 시작';
    } else if (mode.kind === 'verify' && state.doc) {
      btn.disabled = false;
      btn.classList.add('active');
      btn.textContent = mode.photos.length > 0
        ? '검사 시작 (문서 + 사진)'
        : '검사 시작';
    } else {
      btn.disabled = true;
      btn.classList.remove('active');
      btn.textContent = mode.kind === 'inspect'
        ? '사진을 선택해 주세요'
        : '보고서와 사진을 선택해 주세요';
    }
  }

  // ── 샘플 체험 (점검 모드 전용: GET /inspect/demo) ──────────────────────────
  document.getElementById('inspectDemoBtn').addEventListener('click', function () {
    this.disabled = true;
    this.textContent = '점검 체험 로딩 중…';
    fetch('/inspect/demo')
      .then(r => r.json())
      .then(data => {
        if (data.status === 'skipped_api') {
          // API 키 없이 엔진 결과만 받은 경우: inspect_result 로 결과 화면 진입
          renderInspectResult(data.inspect_result, data.draft_md || null);
          this.disabled = false;
          this.textContent = '📷 점검 샘플 체험 (사진 3장)';
          return;
        }
        if (data.error) {
          this.disabled = false;
          this.textContent = '📷 점검 샘플 체험 (사진 3장)';
          showErrorBanner('점검 체험 실패: ' + data.error);
          return;
        }
        // 정상: inspect_result + draft_md 모두 있음
        renderInspectResult(data.inspect_result, data.draft_md || null);
        this.disabled = false;
        this.textContent = '📷 점검 샘플 체험 (사진 3장)';
      })
      .catch(err => {
        this.disabled = false;
        this.textContent = '📷 점검 샘플 체험 (사진 3장)';
        showErrorBanner('점검 체험 실패: ' + err.message);
      });
  });

  // ── 검증 샘플 체험 (POST /jobs/demo → 완료 시 renderVerifyReport) ──────────
  document.getElementById('verifyDemoBtn').addEventListener('click', function () {
    this.disabled = true;
    this.textContent = '검증 체험 로딩 중…';
    mode.kind = 'verify';
    fetch('/jobs/demo', { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (data.error || data.detail) {
          this.disabled = false;
          this.textContent = '📄 검증 샘플 체험 (보고서+사진)';
          showErrorBanner('검증 체험 실패: ' + (data.error || data.detail));
          return;
        }
        jobId = data.job_id;
        enterProgress();
        pollJob();
        this.disabled = false;
        this.textContent = '📄 검증 샘플 체험 (보고서+사진)';
      })
      .catch(err => {
        this.disabled = false;
        this.textContent = '📄 검증 샘플 체험 (보고서+사진)';
        showErrorBanner('검증 체험 실패: ' + err.message);
      });
  });

  // ── 검사 시작 ─────────────────────────────────────────────────────────────
  document.getElementById('startBtn').addEventListener('click', startJob);

  function startJob() {
    if (mode.kind === 'inspect') {
      startInspectJob();
    } else {
      startVerifyJob();
    }
  }

  function startInspectJob() {
    if (!state.photos.length) return;
    const formData = new FormData();
    state.photos.forEach(p => formData.append('files', p));
    formData.append('gauge', 'false');

    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;
    startBtn.textContent = '점검 시작 중…';

    fetch('/inspect', { method: 'POST', body: formData })
      .then(r => r.json())
      .then(data => {
        if (data.error || data.detail) {
          startBtn.disabled = false;
          startBtn.textContent = '안전 점검 시작';
          alert('점검 시작 실패: ' + (data.error || data.detail));
          return;
        }
        jobId = data.job_id;
        enterProgress();
        pollJob();
      })
      .catch(err => {
        startBtn.disabled = false;
        startBtn.textContent = '안전 점검 시작';
        alert('요청 실패: ' + err.message);
      });
  }

  function startVerifyJob() {
    if (!state.doc) return;
    const formData = new FormData();
    formData.append('document', state.doc);
    state.photos.forEach(p => formData.append('photos', p));
    if (state.notice) formData.append('notice', state.notice);

    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;
    startBtn.textContent = '검사 시작 중…';

    fetch('/jobs', { method: 'POST', body: formData })
      .then(r => r.json())
      .then(data => {
        if (data.error || data.detail) {
          startBtn.disabled = false;
          startBtn.textContent = mode.photos.length > 0
            ? '검사 시작 (문서 + 사진)'
            : '검사 시작';
          alert('검사 시작 실패: ' + (data.error || data.detail));
          return;
        }
        jobId = data.job_id;
        enterProgress();
        pollJob();
      })
      .catch(err => {
        startBtn.disabled = false;
        startBtn.textContent = mode.photos.length > 0
          ? '검사 시작 (문서 + 사진)'
          : '검사 시작';
        alert('요청 실패: ' + err.message);
      });
  }

  // ── 진행 화면 진입 ────────────────────────────────────────────────────────
  function enterProgress() {
    document.getElementById('uploadArea').style.display = 'none';
    const ps = document.getElementById('progressScreen');
    ps.style.display = 'block';
    ps.querySelectorAll('.step').forEach(s => { s.classList.remove('active', 'done'); });
    document.getElementById('step1').classList.add('active');
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressLabel').textContent = '0%';
    document.getElementById('retryBadge').style.display = 'none';
    retryCount = 0;
    if (pollRestartTimer) { clearTimeout(pollRestartTimer); pollRestartTimer = null; }
  }

  // ── 폴링 ──────────────────────────────────────────────────────────────────
  function pollJob() {
    fetch('/jobs/' + jobId)
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        retryCount = 0;
        document.getElementById('retryBadge').style.display = 'none';

        if (data.error) {
          showFatalError(data.error);
          return;
        }

        const progress = data.progress || 0;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressLabel').textContent = progress + '%';

        // 스텝퍼 업데이트
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const step4 = document.getElementById('step4');
        step1.classList.remove('active', 'done');
        step2.classList.remove('active', 'done');
        step3.classList.remove('active', 'done');
        step4.classList.remove('active', 'done');

        const step = data.step || '';
        if (step.includes('문서 판독') || progress < 20) {
          step1.classList.add('active');
        } else if (step.includes('법령') || step.includes('문헌') || (progress >= 20 && progress < 50)) {
          step1.classList.add('done');
          step2.classList.add('active');
        } else if (step.includes('사진') || (progress >= 50 && progress < 80)) {
          step1.classList.add('done');
          step2.classList.add('done');
          step3.classList.add('active');
        } else if (step.includes('종합') || progress >= 80) {
          step1.classList.add('done');
          step2.classList.add('done');
          step3.classList.add('done');
          step4.classList.add('active');
        } else if (progress >= 100) {
          step1.classList.add('done');
          step2.classList.add('done');
          step3.classList.add('done');
          step4.classList.add('done');
        }

        if (data.status === 'done') {
          clearInterval(pollTimer);
          pollTimer = null;
          showReport();
        } else if (data.status === 'error') {
          clearInterval(pollTimer);
          pollTimer = null;
          showFatalError(data.error || '처리 중 오류가 발생했습니다.');
        } else {
          pollTimer = setInterval(pollJob, 800);
        }
      })
      .catch(err => {
        // 폴링 오류: 원문 노출 금지, 회색 배지 + 지수 백오프
        document.getElementById('retryBadge').style.display = 'inline-block';
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        retryCount++;
        const delay = Math.min(1000 * Math.pow(2, retryCount - 1), 30000);
        pollRestartTimer = setTimeout(pollJob, delay);
      });
  }

  function showFatalError(msg) {
    clearInterval(pollTimer);
    pollTimer = null;
    if (pollRestartTimer) { clearTimeout(pollRestartTimer); pollRestartTimer = null; }
    document.getElementById('progressScreen').style.display = 'none';
    document.getElementById('uploadArea').style.display = 'block';
    showErrorBanner(msg);
  }

  function showErrorBanner(msg) {
    const banner = document.getElementById('errorBanner');
    banner.style.display = 'block';
    banner.className = 'error-banner';
    banner.innerHTML =
      '<span class="msg">' + escapeHtml(msg).replace(/\n/g, '<br>') + '</span>' +
      '<button class="close-btn" type="button">닫기</button>';
    banner.querySelector('.close-btn').addEventListener('click', function () {
      banner.style.display = 'none';
    });
  }

  // ── 결과 화면 ─────────────────────────────────────────────────────────────
  function showReport() {
    if (mode.kind === 'inspect') {
      // 점검 모드: /jobs/{id} 결과는 {inspect_result, draft_md} 구조
      fetch('/jobs/' + jobId)
        .then(r => r.json())
        .then(data => {
          if (data.error) { showFatalError(data.error); return; }
          const result = data.result;
          if (!result) { showFatalError('점검 결과가 없습니다.'); return; }
          renderInspectResult(result.inspect_result, result.draft_md || null);
        })
        .catch(err => {
          document.getElementById('progressScreen').style.display = 'none';
          document.getElementById('uploadArea').style.display = 'block';
          alert('리포트 로드 실패: ' + err.message);
        });
      return;
    }
    // 검증 모드(기존): /jobs/{id}/report
    fetch('/jobs/' + jobId + '/report')
      .then(r => r.json())
      .then(report => renderVerifyReport(report))
      .catch(err => {
        document.getElementById('progressScreen').style.display = 'none';
        document.getElementById('uploadArea').style.display = 'block';
        alert('리포트 로드 실패: ' + err.message);
      });
  }

  function renderReport(r) {
    if (r.inspect_result !== undefined) {
      renderInspectResult(r.inspect_result, r.draft_md);
      return;
    }
    renderVerifyReport(r);
  }

  // ── 점검 결과 화면 ─────────────────────────────────────────────────────────
  function renderInspectResult(inspect_result, draft_md) {
    const screen = document.getElementById('resultScreen');
    screen.style.display = 'block';
    screen.innerHTML = '';

    const photos = inspect_result && inspect_result.photos ? inspect_result.photos : [];
    const summary = inspect_result && inspect_result.summary ? inspect_result.summary : {};

    // 종합 배지
    const verdict = summary.판정 || '양호';
    const badgeMap = {
      '조치 필요': { cls: 'badge-danger', css: 'var(--red)', bg: 'var(--red-bg)', fg: 'var(--red-fg)', icon: '🔴', label: '조치 필요' },
      '주의':      { cls: 'badge-warning', css: 'var(--orange)', bg: 'var(--orange-bg)', fg: 'var(--orange-fg)', icon: '⚠️', label: '주의' },
      '양호':      { cls: 'badge-caution', css: 'var(--yellow)', bg: 'var(--yellow-bg)', fg: 'var(--yellow-fg)', icon: '✅', label: '양호' },
    };
    const b = badgeMap[verdict] || badgeMap['양호'];

    const summaryBox = document.createElement('div');
    summaryBox.style.cssText =
      'padding:14px 16px;border-radius:10px;background:' + b.bg +
      ';color:' + b.fg + ';border:1px solid;border-bottom:4px solid ' + b.css +
      ';font-weight:600;display:flex;align-items:center;gap:12px;margin-bottom:20px;';
    summaryBox.innerHTML =
      '<span style="font-size:24px;">' + b.icon + '</span>' +
      '<div>' +
      '<div style="font-size:18px;">종합 판정: <b>' + b.label + '</b></div>' +
      '<div style="font-size:13px;opacity:0.85;margin-top:2px;">' +
      '위험 ' + (summary.위험 || 0) + '건 · 주의 ' + (summary.주의 || 0) + '건 · 양호 ' + (summary.양호 || 0) + '건' +
      '</div>' +
      '</div>';
    screen.appendChild(summaryBox);

    // 사진별 카드
    if (photos.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = '점검할 사진이 없습니다.';
      screen.appendChild(empty);
    } else {
      const heading = document.createElement('div');
      heading.className = 'section-heading';
      heading.innerHTML = '사진별 점검 결과 <span class="count">' + photos.length + '</span>장';
      screen.appendChild(heading);

      const cards = document.createElement('div');
      cards.className = 'action-cards';

      photos.forEach((ph, idx) => {
        const photoName = ph.photo || '';
        const risk_level = ph.risk_level || '양호';
        const detections = ph.detections || [];
        const law_refs = ph.law_refs || [];
        const action = ph.action || '';

        const card = document.createElement('div');
        card.className = 'card ' + (
          risk_level === '위험' ? 'badge-danger' :
          risk_level === '주의' ? 'badge-warning' : 'badge-caution'
        );

        // 썸네일(서버 서빙 엔드포인트 사용)
        const photoN = idx + 1;
        let thumbUrl = '';
        const jobIdForThumb = jobId || '';
        if (jobIdForThumb) {
          thumbUrl = '/jobs/' + jobIdForThumb + '/photos/' + photoN;
        }

        // 검출 라벨 칩
        const labelChips = detections.map(d => {
          const label = d.label || '';
          const conf = d.conf != null ? d.conf : 0;
          return '<span class="detection-label">' + escapeHtml(label) + ' ' + conf.toFixed(2) + '</span>';
        }).join(' ');

        // 위험도에 따른 색상 표시
        const riskColorMap = {
          '위험': 'var(--red)',
          '주의': 'var(--orange)',
          '양호': 'var(--green)',
        };

        // 관련 법령 발췌 (접기)
        let lawAccordionHtml = '';
        if (law_refs.length > 0) {
          const items = law_refs.map(ref => {
            const law = ref.법령 || '';
            const jo = ref.조 || '';
            const excerpt = ref.발췌 || '';
            return '<div class="item">' +
              '<div class="item-label">' + escapeHtml(law) + ' ' + escapeHtml(jo) + '</div>' +
              '<div style="margin-top:2px;">' + escapeHtml(excerpt) + '</div>' +
              '</div>';
          }).join('');
          lawAccordionHtml =
            '<details class="accordion" style="margin-top:10px;">' +
            '<summary>관련 법령·조문 발췌 ' + law_refs.length + '건 (접기)</summary>' +
            '<div class="inner">' + items + '</div>' +
            '</details>';
        }

        card.innerHTML =
          '<div class="card-head">' +
          '<span class="card-badge ' +
            (risk_level === '위험' ? 'danger' :
             risk_level === '주의' ? 'warning' : 'caution') + '">' +
            risk_level.toUpperCase() + '</span>' +
          '<p class="card-title">' + escapeHtml(photoName) + '</p>' +
          '</div>' +
          '<p class="card-problem">' + escapeHtml(action) + '</p>' +
          '<div class="card-evidence">' +
          (thumbUrl ? '<img class="photo-thumb" src="' + escapeAttr(thumbUrl) + '" alt="사진 ' + photoN + '">' : '') +
          (labelChips ? '<div style="margin-top:6px;">' + labelChips + '</div>' : '') +
          '</div>' +
          lawAccordionHtml;

        cards.appendChild(card);
      });

      screen.appendChild(cards);
    }

    // 초안 다운로드 + 검증 보내기 버튼
    const actions = document.createElement('div');
    actions.className = 'result-actions';

    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = '점검 보고서 초안 다운로드 (.md)';
    downloadBtn.addEventListener('click', function () {
      if (!draft_md) {
        alert('보고서 초안(draft_md)이 없습니다. (UPSTAGE_API_KEY 미설정 시 생성되지 않습니다)');
        return;
      }
      const blob = new Blob([draft_md], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '안전점검_초안_' + (jobId || 'demo') + '.md';
      a.click();
      URL.revokeObjectURL(url);
    });
    actions.appendChild(downloadBtn);

    const verifyBtn = document.createElement('button');
    verifyBtn.textContent = '이 초안을 보고서 검증에 넣기';
    verifyBtn.addEventListener('click', function () {
      if (!draft_md) {
        alert('보고서 초안이 없어 검증 흐름으로 보낼 수 없습니다. (UPSTAGE_API_KEY 미설정 시 생성되지 않습니다)');
        return;
      }
      // 초안을 텍스트로 기존 검증 흐름(/jobs)에 투입: 문서 대신 초안 텍스트를 임시 파일로 제출
      const formData = new FormData();
      const blob = new Blob([draft_md], { type: 'text/markdown' });
      formData.append('document', blob, '안전점검_초안.md');
      // 사진 점검 결과 자체를 검증 관점으로 다시 보고 싶다면, photos 로 재구성하지 않고
      // 여기서는 "초안만" 보내는 순환 데모로 동작한다.
      fetch('/jobs', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
          if (data.error || data.detail) {
            alert('검증 흐름 투입 실패: ' + (data.error || data.detail));
            return;
          }
          jobId = data.job_id;
          enterProgress();
          pollJob();
        })
        .catch(err => {
          alert('요청 실패: ' + err.message);
        });
    });
    actions.appendChild(verifyBtn);

    screen.appendChild(actions);
  }

  // ── 검증 결과 화면 (기존 렌더, 이름만 변경) ────────────────────────────────
  function renderVerifyReport(r) {
    const screen = document.getElementById('resultScreen');
    screen.style.display = 'block';
    screen.innerHTML = '';

    const gate = r.gate || {};
    const status = gate.status || '확인 필요';
    const reason = gate.reason || '';

    // ── 게이트 배너 ────────────────────────────────────────────────────────
    const statusMap = {
      '제출 가능': { cls: 'submittable', icon: '✅', label: '보고 가능' },
      '보완 필요': { cls: 'revision', icon: '⚠️', label: '보완 필요' },
      '확인 필요': { cls: 'check', icon: '🔍', label: '확인 필요' },
    };
    const s = statusMap[status] || statusMap['확인 필요'];
    const banner = document.createElement('div');
    banner.className = 'gate-banner ' + s.cls;
    banner.innerHTML =
      '<span class="icon">' + s.icon + '</span>' +
      '<div>' +
      '<div><b>' + s.label + '</b></div>' +
      '<div class="reason">' + escapeHtml(reason) + '</div>' +
      '</div>';
    screen.appendChild(banner);

    // ── 집계 ───────────────────────────────────────────────────────────────
    const lawItems = (r.law_section && r.law_section.items) || [];
    const scResults = (r.subcontract_section && r.subcontract_section.results) || [];
    const photoMatches = (r.photo_section && r.photo_section.matches) || [];
    const matchResults = r.match_results || [];
    const refsVerified = r.refs_verified || [];

    const realRefIds = new Set();
    refsVerified.forEach(rv => {
      if (rv.status === 'verified' || rv.status === 'partial') realRefIds.add(rv.id);
    });

    // 조치 필요
    const actionItems = [];

    // ① 법령 ❌ (해당 조 없음)
    lawItems.forEach(item => {
      if (item.verdict === '해당 조 없음') {
        const artStr = '제' + item.article + '조' + (item.paragraph ? ' 제' + item.paragraph + '항' : '');
        actionItems.push({
          badge: 'danger',
          badgeLabel: '법령 ❌',
          title: item.law_name_raw + ' ' + artStr,
          problem: '인용한 법령이 실재하지 않습니다. 법령명·조문번호를 다시 확인하세요.',
          evidence: item.note ? item.note : '해당 조문이 실재하지 않음',
          action: '법령명·조문 재확인 후 보고서 수정',
          tags: ['환각 조항'],
        });
      }
    });

    // ② 사진 뒷받침 안 함
    photoMatches.forEach((m) => {
      if (m.verdict === '뒷받침 안 함') {
        const thumbUrl = m.photo_n ? '/jobs/' + jobId + '/photos/' + m.photo_n : null;
        const label = (m.quote ? m.quote + ' 검출' : (m.domain || '')) + ' · ' + (m.verdict || '');
        actionItems.push({
          badge: 'danger',
          badgeLabel: '사진 🔴',
          title: (m.sentence || '').slice(0, 70),
          problem: '현장 사진이 보고서 주장을 뒷받침하지 않습니다.',
          evidence: '',
          action: '사진 재촬영 또는 해당 주장 수정',
          tags: ['사진 뒷받침 안 함'],
          photoN: m.photo_n,
          thumbUrl: thumbUrl,
          label: label,
          quote: m.quote || '',
          reason: m.reason || '',
        });
      }
    });

    // ③ 오인용 (🔴) — 실재 문헌인데 뒷받침 안 함
    matchResults.forEach(mr => {
      if (mr.verdict === '뒷받침 안 함' && realRefIds.has(mr.ref_id)) {
        actionItems.push({
          badge: 'danger',
          badgeLabel: '오인용 🔴',
          title: (mr.claim || '').slice(0, 70),
          problem: '실재하는 문헌을 내용과 다르게 인용했습니다.',
          evidence: '',
          action: '문헌 원문과 대조 후 인용 수정',
          tags: ['오인용'],
          quote: mr.quote || '',
          reason: mr.reason || '',
          refTitle: mr.metadata_title || '',
        });
      }
    });

    // ④ 적법도급 위험 신호
    scResults.forEach(item => {
      if (item.label === '위험 신호') {
        const ev = (item.evidence_sentences || []).join(' ');
        actionItems.push({
          badge: 'warning',
          badgeLabel: '적법도급 ⚠️',
          title: item.name || ('축 ' + item.axis + ' 항목 ' + item.item),
          problem: item.risk_keywords_hit ? item.risk_keywords_hit.join(', ') : '적법도급 기준 위반 가능성',
          evidence: ev,
          action: '적법도급 기준 준수 여부 재확인',
          tags: ['위험 신호'],
        });
      }
    });

    // ── 적법도급 요약 배지 + 아코디언 ─────────────────────────────────────
    const riskTotal = scResults.filter(x => x.label === '위험 신호').length;
    const compliantTotal = scResults.filter(x => x.label === '적법 방향').length;
    const noneedTotal = scResults.filter(x => x.label === '근거 없음-확인 필요').length;

    const scHeading = document.createElement('div');
    scHeading.className = 'section-heading';
    scHeading.innerHTML = '적법도급 체크리스트 <span class="count">' + scResults.length + '</span>건';
    screen.appendChild(scHeading);

    const badges = document.createElement('div');
    badges.className = 'subcontract-badges';
    if (riskTotal > 0) {
      badges.innerHTML += '<span class="subbadge risk">⚠️ 위험 ' + riskTotal + '건</span>';
    }
    if (compliantTotal > 0) {
      badges.innerHTML += '<span class="subbadge compliant">✅ 적법 방향 ' + compliantTotal + '건</span>';
    }
    if (noneedTotal > 0) {
      badges.innerHTML += '<span class="subbadge noneed">🔍 확인 필요 ' + noneedTotal + '건</span>';
    }
    if (riskTotal === 0 && compliantTotal === 0 && noneedTotal === 0 && scResults.length > 0) {
      badges.innerHTML = '<span class="subbadge compliant">✅ 전부 적법 방향</span>';
    }
    screen.appendChild(badges);

    if (riskTotal > 0) {
      const riskHeading = document.createElement('div');
      riskHeading.style.cssText = 'font-size:13px;font-weight:600;margin:10px 0 6px;color:var(--red);';
      riskHeading.textContent = '⚠️ 위험 신호 ' + riskTotal + '건';
      screen.appendChild(riskHeading);

      const riskList = document.createElement('div');
      riskList.style.cssText = 'font-size:13px;color:var(--text-secondary);margin-bottom:12px;';
      scResults.filter(x => x.label === '위험 신호').forEach(item => {
        const div = document.createElement('div');
        div.style.cssText = 'padding:4px 0;border-bottom:1px solid var(--gray-bg);';
        const ev = (item.evidence_sentences || []).join(' ');
        div.innerHTML =
          '<b>' + escapeHtml(item.name || ('축 ' + item.axis + ' 항목 ' + item.item)) + '</b>' +
          (item.risk_keywords_hit ? ' — ' + escapeHtml(item.risk_keywords_hit.join(', ')) : '') +
          (ev ? '<br><span style="font-size:12px;">근거: ' + escapeHtml(ev) + '</span>' : '');
        riskList.appendChild(div);
      });
      screen.appendChild(riskList);
    }

    // 전체 18항목 아코디언
    if (scResults.length > 0) {
      const acc = document.createElement('details');
      acc.className = 'accordion';
      const total = scResults.length;
      acc.innerHTML = '<summary>전체 ' + total + '항목</summary><div class="inner"></div>';
      const inner = acc.querySelector('.inner');
      scResults.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        const labelColor = {
          '위험 신호': 'var(--red)',
          '적법 방향': 'var(--green)',
          '근거 없음-확인 필요': 'var(--yellow)',
        } [item.label] || 'var(--text)';
        div.innerHTML =
          '<div class="item-label">' +
          '[축 ' + item.axis + '·항목 ' + item.item + '] ' + escapeHtml(item.name || '') +
          ' — <span style="color:' + labelColor + ';">' + escapeHtml(item.label) + '</span>' +
          '</div>' +
          (item.evidence_sentences && item.evidence_sentences.length > 0 ?
            '<div style="margin-top:2px;font-size:12px;color:var(--text-secondary);">근거: ' +
            escapeHtml(item.evidence_sentences.join(' ')) + '</div>' : '');
        inner.appendChild(div);
      });
      screen.appendChild(acc);
    } else {
      const es = document.createElement('p');
      es.className = 'empty-state';
      es.textContent = '적법도급 체크리스트 결과가 없습니다.';
      screen.appendChild(es);
    }

    // ── 하단 버튼 ──────────────────────────────────────────────────────────
    const actions = document.createElement('div');
    actions.className = 'result-actions';
    const saveBtn = document.createElement('button');
    saveBtn.textContent = '결과 JSON 저장';
    saveBtn.addEventListener('click', function () {
      const blob = new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '검증결과_' + jobId + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });
    const rescanBtn = document.createElement('button');
    rescanBtn.textContent = '다시 점검';
    rescanBtn.addEventListener('click', function () {
      screen.style.display = 'none';
      document.getElementById('uploadArea').style.display = 'block';
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').classList.remove('active');
      document.getElementById('startBtn').textContent = '사진 선택 후 안전 점검 시작';
      state.photos = [];
      state.doc = null;
      state.notice = null;
      photoInput.value = '';
      docInput.value = '';
      noticeInput.value = '';
      renderChips();
      updateStartButton();
    });
    actions.appendChild(saveBtn);
    actions.appendChild(rescanBtn);
    screen.appendChild(actions);
  }

})();
</script>
</body>
</html>
